<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Monster Battle Arena - 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Title Screen */
        #title-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a0a0a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .title {
            font-family: 'Times New Roman', serif;
            font-size: 4rem;
            color: #c9a227;
            text-shadow: 0 0 30px rgba(201, 162, 39, 0.8), 0 4px 8px #000;
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: title-glow 3s ease-in-out infinite;
        }

        @keyframes title-glow {
            0%, 100% { text-shadow: 0 0 30px rgba(201, 162, 39, 0.8), 0 4px 8px #000; }
            50% { text-shadow: 0 0 60px rgba(201, 162, 39, 1), 0 4px 8px #000, 0 0 100px rgba(201, 162, 39, 0.5); }
        }

        .subtitle {
            font-size: 1.5rem;
            color: #8b0000;
            margin-top: 10px;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .start-btn {
            margin-top: 60px;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-family: 'Times New Roman', serif;
            background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
            color: #c9a227;
            border: 3px solid #c9a227;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.5);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(201, 162, 39, 0.8);
        }

        /* Selection Screen */
        #selection-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            z-index: 90;
            padding: 20px;
        }

        .selection-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .selection-header h2 {
            font-family: 'Times New Roman', serif;
            font-size: 2rem;
            color: #c9a227;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .selection-panels {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 20px;
            height: calc(100vh - 150px);
        }

        .selection-panel {
            background: linear-gradient(180deg, rgba(40, 20, 20, 0.9) 0%, rgba(20, 10, 10, 0.9) 100%);
            border: 2px solid #8b4513;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-title {
            text-align: center;
            font-size: 1.3rem;
            color: #c9a227;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #8b4513;
        }

        .monster-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .monster-option {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .monster-option:hover {
            border-color: #c9a227;
            background: rgba(201, 162, 39, 0.1);
        }

        .monster-option.selected {
            border-color: #c9a227;
            background: rgba(201, 162, 39, 0.2);
            box-shadow: 0 0 20px rgba(201, 162, 39, 0.3);
        }

        .monster-option .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 5px;
        }

        .monster-option .name {
            font-size: 0.75rem;
            color: #ccc;
        }

        .monster-option .cr {
            font-size: 0.65rem;
            color: #888;
        }

        .vs-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vs-text {
            font-family: 'Times New Roman', serif;
            font-size: 4rem;
            color: #c9a227;
            text-shadow: 0 0 30px rgba(201, 162, 39, 0.8);
        }

        .fight-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Times New Roman', serif;
            background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
            color: #c9a227;
            border: 2px solid #c9a227;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .fight-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .fight-btn:not(:disabled):hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(201, 162, 39, 0.5);
        }

        /* HUD */
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            z-index: 50;
        }

        .combatant-hud {
            position: absolute;
            top: 20px;
            width: 350px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.6) 100%);
            border: 2px solid #8b4513;
            border-radius: 10px;
            padding: 15px;
        }

        .combatant-hud.left { left: 20px; border-left: 4px solid #8b0000; }
        .combatant-hud.right { right: 20px; border-right: 4px solid #1e3a5f; }

        .combatant-name {
            font-family: 'Times New Roman', serif;
            font-size: 1.4rem;
            color: #c9a227;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .combatant-name .icon {
            font-size: 1.8rem;
        }

        .health-bar-outer {
            height: 25px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
        }

        .health-bar-inner {
            height: 100%;
            background: linear-gradient(180deg, #4CAF50 0%, #2d5a30 100%);
            transition: width 0.5s ease-out;
            border-radius: 10px;
        }

        .health-bar-inner.low {
            background: linear-gradient(180deg, #ff9800 0%, #b36b00 100%);
        }

        .health-bar-inner.critical {
            background: linear-gradient(180deg, #f44336 0%, #a02a2a 100%);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.7; }
        }

        .health-text {
            text-align: center;
            margin-top: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Round indicator */
        #round-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #c9a227;
            border-radius: 10px;
            padding: 10px 30px;
            text-align: center;
        }

        #round-indicator .round {
            font-family: 'Times New Roman', serif;
            font-size: 1.2rem;
            color: #c9a227;
        }

        #round-indicator .turn {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Combat log */
        #combat-log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 400px;
            max-height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b4513;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            pointer-events: auto;
        }

        .log-entry {
            font-size: 0.85rem;
            padding: 5px 0;
            border-bottom: 1px solid rgba(139, 69, 19, 0.3);
            animation: log-fade-in 0.3s;
        }

        @keyframes log-fade-in {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-entry.damage { color: #ff6b6b; }
        .log-entry.critical { color: #ff00ff; font-weight: bold; }
        .log-entry.miss { color: #888; }
        .log-entry.ability { color: #00ccff; }
        .log-entry.round { color: #c9a227; font-weight: bold; text-align: center; }
        .log-entry.death { color: #fff; background: rgba(139, 0, 0, 0.3); padding: 8px; border-radius: 5px; }

        /* Victory screen */
        #victory-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 80;
        }

        .victory-title {
            font-family: 'Times New Roman', serif;
            font-size: 4rem;
            color: #c9a227;
            text-shadow: 0 0 50px rgba(201, 162, 39, 0.8);
            animation: victory-pulse 2s infinite;
        }

        @keyframes victory-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .victory-icon {
            font-size: 8rem;
            margin: 30px 0;
        }

        .victory-name {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 40px;
        }

        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #888;
        }

        /* Loading */
        #loading {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top-color: #c9a227;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .title { font-size: 2rem; }
            .selection-panels { grid-template-columns: 1fr; }
            .vs-panel { padding: 20px 0; }
            .combatant-hud { width: 45%; }
            #combat-log { width: calc(100% - 40px); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading"><div class="loader"></div></div>

        <div id="canvas-container"></div>

        <div id="title-screen">
            <h1 class="title">Monster Battle</h1>
            <p class="subtitle">3D Arena</p>
            <button class="start-btn" onclick="showSelection()">Enter Arena</button>
        </div>

        <div id="selection-screen">
            <div class="selection-header">
                <h2>Choose Your Champions</h2>
            </div>
            <div class="selection-panels">
                <div class="selection-panel">
                    <div class="panel-title">🔴 Red Corner</div>
                    <div class="monster-list" id="red-list"></div>
                </div>
                <div class="vs-panel">
                    <div class="vs-text">VS</div>
                    <button class="fight-btn" id="fight-btn" disabled onclick="startBattle()">⚔️ FIGHT</button>
                    <button class="fight-btn" style="margin-top:15px;background:#333;" onclick="backToTitle()">← Back</button>
                </div>
                <div class="selection-panel">
                    <div class="panel-title">🔵 Blue Corner</div>
                    <div class="monster-list" id="blue-list"></div>
                </div>
            </div>
        </div>

        <div id="hud">
            <div class="combatant-hud left" id="hud-left">
                <div class="combatant-name"><span class="icon">🐉</span><span class="text">Monster 1</span></div>
                <div class="health-bar-outer"><div class="health-bar-inner" id="health-left"></div></div>
                <div class="health-text" id="health-text-left">100 / 100</div>
            </div>
            <div id="round-indicator">
                <div class="round">Round <span id="round-num">1</span></div>
                <div class="turn" id="turn-text">Battle Start!</div>
            </div>
            <div class="combatant-hud right" id="hud-right">
                <div class="combatant-name"><span class="icon">👁</span><span class="text">Monster 2</span></div>
                <div class="health-bar-outer"><div class="health-bar-inner" id="health-right"></div></div>
                <div class="health-text" id="health-text-right">100 / 100</div>
            </div>
            <div id="combat-log"></div>
            <div id="controls-hint">🖱️ Drag to rotate • Scroll to zoom</div>
        </div>

        <div id="victory-screen">
            <div class="victory-title">⚔️ VICTORY ⚔️</div>
            <div class="victory-icon" id="victory-icon">🐉</div>
            <div class="victory-name" id="victory-name">Winner Name</div>
            <button class="start-btn" onclick="resetGame()">Fight Again</button>
        </div>
    </div>

    <script>

    // ============================================

        "storm-giant": {
            name: "Storm Giant", icon: "⛈️", type: "giant", cr: 13,

            multiattack: 2,
            special: { name: "Lightning Strike", dmg: "12d8", type: "lightning", save: { stat: "dex", dc: 17 }, recharge: true },

        },
        "death-knight": {

            hp: 180, ac: 20, color: 0x2f4f4f,
            abilities: { str: 20, dex: 11, con: 20, int: 12, wis: 16, cha: 18 },
            attacks: [{ name: "Longsword", hit: 11, dmg: "1d8+5", type: "slashing", extra: "4d8 necrotic" }],
            multiattack: 3,
            special: { name: "Hellfire Orb", dmg: "10d6", type: "fire", extra: "10d6 necrotic", save: { stat: "dex", dc: 18 }, recharge: true },
            immunities: ["necrotic", "poison"]
        },
        "iron-golem": {
            name: "Iron Golem", icon: "🤖", type: "construct", cr: 16,
            hp: 210, ac: 20, color: 0x708090,
            abilities: { str: 24, dex: 9, con: 20, int: 3, wis: 11, cha: 1 },
            attacks: [{ name: "Slam", hit: 13, dmg: "3d8+7", type: "bludgeoning" }],
            multiattack: 2,
            special: { name: "Poison Breath", dmg: "10d8", type: "poison", save: { stat: "con", dc: 19 }, recharge: true },
            immunities: ["fire", "poison", "psychic"],
            fireAbsorption: true
        },
        "mind-flayer": {
            name: "Mind Flayer", icon: "🦑", type: "aberration", cr: 7,
            hp: 71, ac: 15, color: 0x9932cc,
            abilities: { str: 11, dex: 12, con: 12, int: 19, wis: 17, cha: 17 },
            attacks: [{ name: "Tentacles", hit: 7, dmg: "2d10+4", type: "psychic" }],
            special: { name: "Mind Blast", dmg: "4d8+4", type: "psychic", save: { stat: "int", dc: 15 }, recharge: true, stun: true }
        },
        "vampire": {
            name: "Vampire", icon: "🧛", type: "undead", cr: 13,
            hp: 144, ac: 16, color: 0x4a0000,
            abilities: { str: 18, dex: 18, con: 18, int: 17, wis: 15, cha: 18 },
            attacks: [{ name: "Unarmed", hit: 9, dmg: "1d8+4", type: "bludgeoning" },
                      { name: "Bite", hit: 9, dmg: "1d6+4", type: "piercing", extra: "3d6 necrotic" }],
            multiattack: 2,
            regeneration: 20
        }

    // ============================================
    // THREE.JS SCENE SETUP
    // ============================================
    let scene, camera, renderer, clock;
    let arena, monsters = {}, particles = [];
    let isMouseDown = false, mouseX = 0, mouseY = 0;
    let cameraAngle = 0, cameraHeight = 8, cameraDistance = 20;
    let battleState = null;

    function initThreeJS() {
        // Scene
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0505, 0.015);

        // Camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        updateCamera();

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        clock = new THREE.Clock();

        // Create arena
        createArena();

        // Lighting
        createLighting();

        // Start animation
        animate();

        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 500);

        // Event listeners
        setupControls();
    }

    function createArena() {
        // Ground - stone floor with glow
        const floorGeom = new THREE.CircleGeometry(15, 64);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x2a2a2a,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Glowing rune circle
        const runeGeom = new THREE.RingGeometry(10, 10.5, 64);
        const runeMat = new THREE.MeshBasicMaterial({ color: 0xc9a227, transparent: true, opacity: 0.6 });
        const runes = new THREE.Mesh(runeGeom, runeMat);
        runes.rotation.x = -Math.PI / 2;
        runes.position.y = 0.01;
        scene.add(runes);

        // Inner rune circle
        const innerRuneGeom = new THREE.RingGeometry(5, 5.3, 64);
        const innerRunes = new THREE.Mesh(innerRuneGeom, runeMat.clone());
        innerRunes.rotation.x = -Math.PI / 2;
        innerRunes.position.y = 0.01;
        scene.add(innerRunes);

        // Arena walls (columns)
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const x = Math.cos(angle) * 14;
            const z = Math.sin(angle) * 14;

            // Column
            const colGeom = new THREE.CylinderGeometry(0.5, 0.6, 8, 8);
            const colMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.7 });
            const column = new THREE.Mesh(colGeom, colMat);
            column.position.set(x, 4, z);
            column.castShadow = true;
            scene.add(column);

            // Torch fire (every other column)
            if (i % 2 === 0) {
                const torchLight = new THREE.PointLight(0xff6600, 1, 10);
                torchLight.position.set(x, 6, z);
                scene.add(torchLight);

                // Fire particles
                createTorchFire(x, 5.5, z);

        // Skybox - dark gradient
        const skyGeom = new THREE.SphereGeometry(100, 32, 32);
        const skyMat = new THREE.MeshBasicMaterial({
            color: 0x0a0505,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeom, skyMat);
        scene.add(sky);

        // Floating particles (dust/embers)
        createAmbientParticles();
    }

    function createTorchFire(x, y, z) {
        const particleCount = 20;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = x + (Math.random() - 0.5) * 0.3;
            positions[i * 3 + 1] = y + Math.random() * 0.5;
            positions[i * 3 + 2] = z + (Math.random() - 0.5) * 0.3;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0xff6600,
            size: 0.2,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const fire = new THREE.Points(geometry, material);
        fire.userData = { type: 'torch', baseY: y, baseX: x, baseZ: z };
        scene.add(fire);
        particles.push(fire);
    }

    function createAmbientParticles() {
        const particleCount = 200;
        const geometry = new THREE.BufferGeometry();

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 30;

    function createMonster3D(monsterData, side) {
        const group = new THREE.Group();
        const color = monsterData.color || 0x888888;
        const type = monsterData.type || 'beast';

        // Base body based on type
        let body;
        switch (type) {
            case 'dragon':
                body = createDragonBody(color);
                break;
            case 'undead':
                body = createUndeadBody(color);
                break;
            case 'fiend':
                body = createFiendBody(color);
                break;
            case 'aberration':
                body = createAberrationBody(color);
                break;
            case 'giant':
                body = createGiantBody(color);
                break;
            case 'construct':
                body = createConstructBody(color);
                break;
            default:
                body = createBeastBody(color);
        }

        group.add(body);

        // Glowing eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const eyeGeom = new THREE.SphereGeometry(0.1, 8, 8);

        const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
        leftEye.position.set(-0.2, 1.5, 0.4);
        group.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeom, eyeMat.clone());
        rightEye.position.set(0.2, 1.5, 0.4);
        group.add(rightEye);

        // Position based on side
        const xPos = side === 'red' ? -6 : 6;
        group.position.set(xPos, 0, 0);
        group.rotation.y = side === 'red' ? Math.PI / 6 : -Math.PI / 6;

        group.userData = {
            monster: monsterData,
            side: side,
            baseY: 0,
            idlePhase: Math.random() * Math.PI * 2
        };

        scene.add(group);
        return group;
    }

    // ============================================
    // PARTICLE EFFECTS
    // ============================================
    function createAttackEffect(attacker, defender, type) {
        const startPos = attacker.position.clone();
        startPos.y += 1.5;
        const endPos = defender.position.clone();
        endPos.y += 1.5;

        const color = {
            'fire': 0xff4400,
            'cold': 0x44ccff,
            'lightning': 0xffff00,
            'necrotic': 0x44ff44,
            'force': 0xff00ff,
            'poison': 0x00ff00,
            'psychic': 0x9944ff,
            'piercing': 0xffffff,
            'slashing': 0xcccccc,
            'bludgeoning': 0x888888
        }[type] || 0xff6600;

        // Create particle trail
        const particleCount = 50;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = startPos.x;
            positions[i * 3 + 1] = startPos.y;
            positions[i * 3 + 2] = startPos.z;

            velocities.push({
                x: (endPos.x - startPos.x) / 30 + (Math.random() - 0.5) * 0.2,
                y: (endPos.y - startPos.y) / 30 + (Math.random() - 0.5) * 0.2,
                z: (endPos.z - startPos.z) / 30 + (Math.random() - 0.5) * 0.2
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: color,
            size: 0.3,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        particles.userData = {
            type: 'attack',
            velocities: velocities,
            life: 30,
            endPos: endPos
        };

        scene.add(particles);

        // Impact effect after delay
        setTimeout(() => {
            createImpactEffect(endPos, color);
        }, 300);
    }

    function createImpactEffect(position, color) {
        const particleCount = 30;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = position.x;
            positions[i * 3 + 1] = position.y;
            positions[i * 3 + 2] = position.z;

            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 0.3 + 0.1;
            velocities.push({
                x: Math.cos(angle) * speed,
                y: Math.random() * 0.3,
                z: Math.sin(angle) * speed
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: color,
            size: 0.25,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending
        });

        const impact = new THREE.Points(geometry, material);
        impact.userData = {
            type: 'impact',
            velocities: velocities,
            life: 40
        };

        scene.add(impact);
    }

    function createBreathWeapon(attacker, defender, type) {
        const startPos = attacker.position.clone();
        startPos.y += 1.5;
        const direction = defender.position.clone().sub(startPos).normalize();

        const color = {
            'fire': 0xff4400,
            'cold': 0x44ccff,
            'lightning': 0xffff00,
            'poison': 0x00ff00,
            'acid': 0x88ff00
        }[type] || 0xff4400;

        // Cone of particles
        const particleCount = 200;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = startPos.x;
            positions[i * 3 + 1] = startPos.y;
            positions[i * 3 + 2] = startPos.z;

            const spread = 0.5;
            velocities.push({
                x: direction.x * 0.5 + (Math.random() - 0.5) * spread,
                y: direction.y * 0.5 + (Math.random() - 0.5) * spread,
                z: direction.z * 0.5 + (Math.random() - 0.5) * spread,
                delay: Math.floor(Math.random() * 20)
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: color,
            size: 0.4,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });

        const breath = new THREE.Points(geometry, material);
        breath.userData = {
            type: 'breath',
            velocities: velocities,
            life: 60,
            frame: 0
        };

        scene.add(breath);
    }

    // ============================================
    // ANIMATION LOOP
    // ============================================
    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const time = clock.getElapsedTime();

        // Auto-rotate camera slightly
        if (!isMouseDown && battleState?.isRunning) {
            cameraAngle += delta * 0.1;
        }
        updateCamera();

        // Animate monsters
        Object.values(monsters).forEach(m => {
            if (m.userData) {
                // Idle breathing/bobbing
                m.position.y = m.userData.baseY + Math.sin(time * 2 + m.userData.idlePhase) * 0.1;
                // Slight rotation wobble
                m.rotation.y += Math.sin(time * 1.5 + m.userData.idlePhase) * 0.002;
            }
        });

        // Animate particles
        particles.forEach((p, index) => {
            if (p.userData.type === 'torch') {
                // Torch fire animation
                const positions = p.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] = p.userData.baseX + (Math.random() - 0.5) * 0.3;
                    positions[i + 1] = p.userData.baseY + Math.random() * 0.8;
                    positions[i + 2] = p.userData.baseZ + (Math.random() - 0.5) * 0.3;
                }
                p.geometry.attributes.position.needsUpdate = true;
            } else if (p.userData.type === 'dust') {
                // Floating dust
                const positions = p.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += 0.005;
                    if (positions[i] > 15) positions[i] = 0;
                }
                p.geometry.attributes.position.needsUpdate = true;
            }
        });

        // Animate attack particles
        scene.children.forEach(child => {
            if (child.userData?.type === 'attack') {
                const positions = child.geometry.attributes.position.array;
                const velocities = child.userData.velocities;

                for (let i = 0; i < velocities.length; i++) {
                    positions[i * 3] += velocities[i].x;
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3 + 2] += velocities[i].z;
                }

                child.geometry.attributes.position.needsUpdate = true;
                child.material.opacity -= 0.02;
                child.userData.life--;

                if (child.userData.life <= 0) {
                    scene.remove(child);
                }
            } else if (child.userData?.type === 'impact') {
                const positions = child.geometry.attributes.position.array;
                const velocities = child.userData.velocities;

                for (let i = 0; i < velocities.length; i++) {
                    positions[i * 3] += velocities[i].x;
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3 + 2] += velocities[i].z;
                    velocities[i].y -= 0.01; // gravity
                }

                child.geometry.attributes.position.needsUpdate = true;
                child.material.opacity -= 0.025;
                child.userData.life--;

                if (child.userData.life <= 0) {
                    scene.remove(child);
                }
            } else if (child.userData?.type === 'breath') {
                const positions = child.geometry.attributes.position.array;
                const velocities = child.userData.velocities;
                child.userData.frame++;

                for (let i = 0; i < velocities.length; i++) {
                    if (child.userData.frame > velocities[i].delay) {
                        positions[i * 3] += velocities[i].x;
                        positions[i * 3 + 1] += velocities[i].y;
                        positions[i * 3 + 2] += velocities[i].z;
                    }
                }

                child.geometry.attributes.position.needsUpdate = true;
                child.userData.life--;

                if (child.userData.life <= 0) {
                    scene.remove(child);
                }
            }
        });

        renderer.render(scene, camera);
    }

    function updateCamera() {
        camera.position.x = Math.sin(cameraAngle) * cameraDistance;
        camera.position.z = Math.cos(cameraAngle) * cameraDistance;
        camera.position.y = cameraHeight;
        camera.lookAt(0, 2, 0);
    }

    function setupControls() {
        const canvas = renderer.domElement;

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                cameraAngle -= deltaX * 0.01;
                cameraHeight = Math.max(3, Math.min(20, cameraHeight + deltaY * 0.05));
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });

        canvas.addEventListener('mouseup', () => isMouseDown = false);
        canvas.addEventListener('mouseleave', () => isMouseDown = false);

        canvas.addEventListener('wheel', (e) => {
            cameraDistance = Math.max(10, Math.min(40, cameraDistance + e.deltaY * 0.02));
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // ============================================
    // UI & GAME LOGIC
    // ============================================
    let selectedRed = null;
    let selectedBlue = null;

    function showSelection() {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('selection-screen').style.display = 'block';
        populateMonsterLists();
    }

    function backToTitle() {
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('title-screen').style.display = 'flex';
        selectedRed = null;
        selectedBlue = null;
    }

    function populateMonsterLists() {
        const redList = document.getElementById('red-list');
        const blueList = document.getElementById('blue-list');

        redList.innerHTML = '';
        blueList.innerHTML = '';

        Object.entries(MONSTERS).forEach(([key, m]) => {
            const html = `
                <div class="monster-option" data-key="${key}">
                    <span class="icon">${m.icon}</span>
                    <div class="name">${m.name}</div>
                    <div class="cr">CR ${m.cr}</div>
                </div>
            `;
            redList.innerHTML += html;
            blueList.innerHTML += html;
        });

        // Event listeners
        redList.querySelectorAll('.monster-option').forEach(el => {
            el.addEventListener('click', () => selectMonster('red', el.dataset.key));
        });

        blueList.querySelectorAll('.monster-option').forEach(el => {
            el.addEventListener('click', () => selectMonster('blue', el.dataset.key));
        });
    }

    function selectMonster(side, key) {
        const list = document.getElementById(`${side}-list`);

        // Clear previous selection
        list.querySelectorAll('.monster-option').forEach(el => el.classList.remove('selected'));

        // Select new
        list.querySelector(`[data-key="${key}"]`).classList.add('selected');

        if (side === 'red') {
            selectedRed = key;
        } else {
            selectedBlue = key;
        }

        // Enable fight button if both selected
        document.getElementById('fight-btn').disabled = !(selectedRed && selectedBlue);
    }

    function startBattle() {
        if (!selectedRed || !selectedBlue) return;

        // Hide selection, show HUD
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'block';

        // Create 3D monsters
        if (monsters.red) scene.remove(monsters.red);
        if (monsters.blue) scene.remove(monsters.blue);

        monsters.red = createMonster3D(MONSTERS[selectedRed], 'red');
        monsters.blue = createMonster3D(MONSTERS[selectedBlue], 'blue');

        // Initialize battle state
        battleState = {
            isRunning: true,
            round: 1,
            red: {
                ...MONSTERS[selectedRed],
                key: selectedRed,
                currentHp: MONSTERS[selectedRed].hp,
                maxHp: MONSTERS[selectedRed].hp,
                specialCharged: true
            },
            blue: {
                ...MONSTERS[selectedBlue],
                key: selectedBlue,
                currentHp: MONSTERS[selectedBlue].hp,
                maxHp: MONSTERS[selectedBlue].hp,
                specialCharged: true
            }
        };

        // Update HUD
        updateHUD();

        // Clear combat log
        document.getElementById('combat-log').innerHTML = '';
        logMessage('⚔️ BATTLE BEGINS! ⚔️', 'round');

        // Roll initiative and start
        const redInit = rollD20() + getMod(battleState.red.abilities.dex);
        const blueInit = rollD20() + getMod(battleState.blue.abilities.dex);

        logMessage(`${battleState.red.icon} ${battleState.red.name} rolls ${redInit} initiative`);
        logMessage(`${battleState.blue.icon} ${battleState.blue.name} rolls ${blueInit} initiative`);

        battleState.turnOrder = redInit >= blueInit ? ['red', 'blue'] : ['blue', 'red'];
        battleState.currentTurn = 0;

        logMessage(`${MONSTERS[battleState.turnOrder[0] === 'red' ? selectedRed : selectedBlue].name} goes first!`, 'round');

        // Start combat loop
        setTimeout(runCombatTurn, 1500);
    }

    function runCombatTurn() {
        if (!battleState?.isRunning) return;

        const attackerSide = battleState.turnOrder[battleState.currentTurn];
        const defenderSide = attackerSide === 'red' ? 'blue' : 'red';

        const attacker = battleState[attackerSide];
        const defender = battleState[defenderSide];

        // Update turn indicator
        document.getElementById('turn-text').textContent = `${attacker.icon} ${attacker.name}'s turn`;

        // Regeneration
        if (attacker.regeneration && attacker.currentHp > 0) {
            attacker.currentHp = Math.min(attacker.maxHp, attacker.currentHp + attacker.regeneration);
            logMessage(`${attacker.icon} regenerates ${attacker.regeneration} HP!`, 'ability');
            updateHUD();
        }

        // Recharge special
        if (!attacker.specialCharged && attacker.special?.recharge) {
            if (rollD20() >= 5) {
                attacker.specialCharged = true;
                logMessage(`${attacker.icon} ${attacker.special.name} recharged!`, 'ability');
            }
        }

        // Choose action: special or attacks
        setTimeout(() => {
            if (attacker.special && attacker.specialCharged && Math.random() > 0.4) {
                executeSpecial(attackerSide, defenderSide);
            } else {
                executeAttacks(attackerSide, defenderSide);
            }
        }, 500);
    }

    function executeSpecial(attackerSide, defenderSide) {
        const attacker = battleState[attackerSide];
        const defender = battleState[defenderSide];
        const special = attacker.special;

        attacker.specialCharged = false;

        // Power Word Kill
        if (special.instant && special.threshold) {
            if (defender.currentHp <= special.threshold) {
                logMessage(`${attacker.icon} casts POWER WORD KILL!`, 'critical');
                defender.currentHp = 0;
                createBreathWeapon(monsters[attackerSide], monsters[defenderSide], 'necrotic');
                updateHUD();
                checkVictory();
                return;
            } else {
                logMessage(`${attacker.icon} ${attacker.name} attempts Power Word Kill but ${defender.name} has too many HP!`, 'miss');
                nextTurn();
                return;
            }
        }

        // Breath/spell attack
        const dmgRoll = rollDice(special.dmg);
        let damage = dmgRoll.total;

        // Save
        if (special.save) {
            const saveRoll = rollD20() + getMod(defender.abilities[special.save.stat]);
            if (saveRoll >= special.save.dc) {
                damage = Math.floor(damage / 2);
                logMessage(`${defender.icon} saves! (${saveRoll} vs DC ${special.save.dc})`, 'miss');
            }
        }

        // Check immunity
        if (defender.immunities?.includes(special.type)) {
            logMessage(`${defender.icon} is IMMUNE to ${special.type}!`, 'miss');
            damage = 0;
        }

        // Fire absorption
        if (defender.fireAbsorption && special.type === 'fire') {
            defender.currentHp = Math.min(defender.maxHp, defender.currentHp + damage);
            logMessage(`${defender.icon} ABSORBS ${damage} fire damage!`, 'ability');
            createBreathWeapon(monsters[attackerSide], monsters[defenderSide], special.type);
            updateHUD();
            nextTurn();
            return;
        }

        if (damage > 0) {
            defender.currentHp -= damage;
            logMessage(`${attacker.icon} uses ${special.name}! ${damage} ${special.type} damage!`, 'ability');
            createBreathWeapon(monsters[attackerSide], monsters[defenderSide], special.type);
        }

        updateHUD();
        setTimeout(() => checkVictory() || nextTurn(), 1000);
    }

    function executeAttacks(attackerSide, defenderSide) {
        const attacker = battleState[attackerSide];
        const defender = battleState[defenderSide];

        const numAttacks = attacker.multiattack || 1;
        let attackIndex = 0;

        function doAttack() {
            if (attackIndex >= numAttacks || defender.currentHp <= 0) {
                setTimeout(() => checkVictory() || nextTurn(), 500);
                return;
            }

            const attack = attacker.attacks[attackIndex % attacker.attacks.length];
            const roll = rollD20();
            const isCrit = roll === 20;
            const total = roll + attack.hit;

            if (roll === 1 || (!isCrit && total < defender.ac)) {
                logMessage(`${attacker.icon} ${attack.name} misses! (${total} vs AC ${defender.ac})`, 'miss');
            } else {
                let damage = rollDice(attack.dmg).total;
                if (isCrit) damage += rollDice(attack.dmg).total;

                // Extra damage
                if (attack.extra) {
                    const extraMatch = attack.extra.match(/(\d+d\d+)/);
                    if (extraMatch) {
                        const extraDmg = rollDice(extraMatch[1]).total;
                        const extraType = attack.extra.split(' ').pop();
                        if (!defender.immunities?.includes(extraType)) {
                            damage += extraDmg;
                        }
                    }
                }

                // Check immunity
                if (defender.immunities?.includes(attack.type)) {
                    logMessage(`${defender.icon} is IMMUNE to ${attack.type}!`, 'miss');
                } else {
                    defender.currentHp -= damage;
                    logMessage(`${attacker.icon} ${isCrit ? 'CRITICAL ' : ''}${attack.name}! ${damage} damage!`, isCrit ? 'critical' : 'damage');
                    createAttackEffect(monsters[attackerSide], monsters[defenderSide], attack.type);

                    // Hit animation
                    if (monsters[defenderSide]) {
                        const originalX = monsters[defenderSide].position.x;
                        monsters[defenderSide].position.x += (attackerSide === 'red' ? 0.3 : -0.3);
                        setTimeout(() => {
                            if (monsters[defenderSide]) monsters[defenderSide].position.x = originalX;
                        }, 150);
                    }
                }
            }

            updateHUD();
            attackIndex++;
            setTimeout(doAttack, 600);
        }

        doAttack();
    }

    function nextTurn() {
        battleState.currentTurn = (battleState.currentTurn + 1) % 2;

        if (battleState.currentTurn === 0) {
            battleState.round++;
            document.getElementById('round-num').textContent = battleState.round;
            logMessage(`═══ ROUND ${battleState.round} ═══`, 'round');
        }

        setTimeout(runCombatTurn, 800);
    }

    function checkVictory() {
        if (battleState.red.currentHp <= 0) {
            endBattle('blue');
            return true;
        }
        if (battleState.blue.currentHp <= 0) {
            endBattle('red');
            return true;
        }
        return false;
    }

    function endBattle(winner) {
        battleState.isRunning = false;

        const winnerData = battleState[winner];
        logMessage(`💀 ${battleState[winner === 'red' ? 'blue' : 'red'].name} has been DEFEATED!`, 'death');
        logMessage(`🏆 ${winnerData.name} WINS! 🏆`, 'round');

        // Death animation for loser
        const loserSide = winner === 'red' ? 'blue' : 'red';
        if (monsters[loserSide]) {
            monsters[loserSide].traverse(child => {
                if (child.material) {
                    child.material.transparent = true;
                    child.material.opacity = 0.3;
                }
            });
        }

        setTimeout(() => {
            document.getElementById('victory-icon').textContent = winnerData.icon;
            document.getElementById('victory-name').textContent = winnerData.name;
            document.getElementById('victory-screen').style.display = 'flex';
        }, 1500);
    }

    function resetGame() {
        document.getElementById('victory-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('selection-screen').style.display = 'block';

        // Clear monsters
        if (monsters.red) scene.remove(monsters.red);
        if (monsters.blue) scene.remove(monsters.blue);
        monsters = {};

        battleState = null;
        selectedRed = null;
        selectedBlue = null;

        // Reset selection UI
        document.querySelectorAll('.monster-option').forEach(el => el.classList.remove('selected'));
        document.getElementById('fight-btn').disabled = true;
    }

    function updateHUD() {
        if (!battleState) return;

        // Red side
        const redHp = Math.max(0, battleState.red.currentHp);
        const redPercent = (redHp / battleState.red.maxHp) * 100;
        document.querySelector('#hud-left .text').textContent = battleState.red.name;
        document.querySelector('#hud-left .icon').textContent = battleState.red.icon;
        document.getElementById('health-left').style.width = redPercent + '%';
        document.getElementById('health-left').className = 'health-bar-inner' +
            (redPercent <= 25 ? ' critical' : redPercent <= 50 ? ' low' : '');
        document.getElementById('health-text-left').textContent = `${redHp} / ${battleState.red.maxHp}`;

        // Blue side
        const blueHp = Math.max(0, battleState.blue.currentHp);
        const bluePercent = (blueHp / battleState.blue.maxHp) * 100;
        document.querySelector('#hud-right .text').textContent = battleState.blue.name;
        document.querySelector('#hud-right .icon').textContent = battleState.blue.icon;
        document.getElementById('health-right').style.width = bluePercent + '%';
        document.getElementById('health-right').className = 'health-bar-inner' +
            (bluePercent <= 25 ? ' critical' : bluePercent <= 50 ? ' low' : '');
        document.getElementById('health-text-right').textContent = `${blueHp} / ${battleState.blue.maxHp}`;
    }

    function logMessage(msg, type = '') {
        const log = document.getElementById('combat-log');
        const entry = document.createElement('div');
        entry.className = 'log-entry ' + type;
        entry.innerHTML = msg;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
    }

    // ============================================
    // DICE UTILITIES
    // ============================================
    function rollD20() {
        return Math.floor(Math.random() * 20) + 1;
    }

    function rollDice(notation) {
        const match = notation.match(/(\d+)d(\d+)([+-]\d+)?/);
        if (!match) return { total: parseInt(notation) || 0 };

        const count = parseInt(match[1]);
        const sides = parseInt(match[2]);
        const mod = parseInt(match[3]) || 0;

        let total = 0;
        for (let i = 0; i < count; i++) {
            total += Math.floor(Math.random() * sides) + 1;
        }
        return { total: total + mod };
    }

    function getMod(score) {
        return Math.floor((score - 10) / 2);
    }

    // ============================================
    // INIT
    // ============================================
    window.onload = initThreeJS;
    </script>
