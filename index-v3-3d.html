<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Monster Battle Arena - 3D Ultimate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="v3/monsters.js"></script>
    <script src="v3/audio.js"></script>
    <script src="v3/combat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        #canvas-container { position: absolute; inset: 0; }

        /* Screens */
        .screen { position: absolute; inset: 0; display: none; z-index: 100; }
        .screen.active { display: flex; }

        /* Title */
        #title-screen { background: radial-gradient(ellipse at center, #1a0a0a 0%, #000 100%); flex-direction: column; align-items: center; justify-content: center; }
        .title { font-family: 'Times New Roman', serif; font-size: 3.5rem; color: #c9a227; text-shadow: 0 0 30px rgba(201,162,39,0.8), 0 4px 8px #000; letter-spacing: 6px; text-transform: uppercase; animation: glow 3s infinite; }
        @keyframes glow { 50% { text-shadow: 0 0 60px rgba(201,162,39,1), 0 4px 8px #000; } }
        .subtitle { font-size: 1.3rem; color: #8b0000; margin-top: 10px; letter-spacing: 8px; }
        .mode-buttons { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 50px; justify-content: center; max-width: 800px; }
        .mode-btn { padding: 25px 35px; font-size: 1.1rem; font-family: 'Times New Roman', serif; background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%); color: #c9a227; border: 2px solid #c9a227; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; min-width: 180px; }
        .mode-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(201,162,39,0.5); }
        .mode-btn .icon { font-size: 2rem; display: block; margin-bottom: 10px; }

        /* Selection Screen */
        #select-screen { background: rgba(0,0,0,0.9); flex-direction: column; padding: 20px; }
        .select-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2px solid #c9a227; margin-bottom: 20px; }
        .select-title { font-family: 'Times New Roman', serif; font-size: 1.8rem; color: #c9a227; }
        .header-btn { padding: 10px 25px; background: #333; color: #c9a227; border: 2px solid #c9a227; cursor: pointer; font-size: 1rem; }
        .header-btn:hover { background: #444; }
        .header-btn.fight { background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%); }
        .header-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .select-body { display: grid; grid-template-columns: 1fr 120px 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .team-panel { background: rgba(30,20,20,0.8); border: 2px solid #8b4513; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .team-title { text-align: center; padding: 15px; font-size: 1.3rem; color: #c9a227; border-bottom: 2px solid #8b4513; }
        .team-title.red { border-left: 4px solid #8b0000; }
        .team-title.blue { border-right: 4px solid #1e3a5f; }

        .team-slots { display: flex; gap: 10px; padding: 15px; flex-wrap: wrap; min-height: 100px; background: rgba(0,0,0,0.3); }
        .team-slot { width: 70px; height: 85px; border: 2px dashed #666; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: #666; }
        .team-slot.filled { border-style: solid; border-color: #c9a227; background: rgba(201,162,39,0.1); cursor: pointer; }
        .team-slot .icon { font-size: 1.8rem; }
        .team-slot .name { font-size: 0.6rem; text-align: center; color: #ccc; margin-top: 3px; }

        .type-filters { display: flex; gap: 5px; padding: 10px; flex-wrap: wrap; border-bottom: 1px solid #444; }
        .type-btn { padding: 5px 12px; font-size: 0.75rem; background: #333; color: #aaa; border: 1px solid #555; border-radius: 12px; cursor: pointer; }
        .type-btn:hover, .type-btn.active { background: #c9a227; color: #000; border-color: #c9a227; }

        .monster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; padding: 10px; overflow-y: auto; flex: 1; }
        .monster-card { background: rgba(0,0,0,0.5); border: 2px solid #555; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .monster-card:hover { border-color: #c9a227; background: rgba(201,162,39,0.1); }
        .monster-card.selected { border-color: #c9a227; background: rgba(201,162,39,0.2); }
        .monster-card.disabled { opacity: 0.3; pointer-events: none; }
        .monster-card .icon { font-size: 2rem; }
        .monster-card .name { font-size: 0.65rem; color: #ccc; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .monster-card .cr { font-size: 0.6rem; color: #888; }

        .vs-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .vs-text { font-family: 'Times New Roman', serif; font-size: 3rem; color: #c9a227; text-shadow: 0 0 20px rgba(201,162,39,0.5); }

        /* Tournament Screen */
        #tournament-screen { background: rgba(0,0,0,0.95); flex-direction: column; padding: 20px; }
        .bracket { display: flex; justify-content: center; gap: 30px; padding: 20px; overflow-x: auto; flex: 1; align-items: center; }
        .bracket-round { display: flex; flex-direction: column; gap: 20px; }
        .round-label { text-align: center; color: #c9a227; font-size: 1.1rem; margin-bottom: 10px; }
        .bracket-match { background: #1a1a1a; border: 2px solid #555; border-radius: 8px; min-width: 150px; overflow: hidden; }
        .bracket-match.active { border-color: #c9a227; box-shadow: 0 0 15px rgba(201,162,39,0.4); }
        .bracket-fighter { padding: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #333; }
        .bracket-fighter:last-child { border-bottom: none; }
        .bracket-fighter.winner { background: rgba(201,162,39,0.2); }
        .bracket-fighter.loser { opacity: 0.4; text-decoration: line-through; }
        .bracket-fighter .icon { font-size: 1.2rem; }
        .bracket-fighter .name { font-size: 0.85rem; }

        /* HUD */
        #hud { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 50; }
        .combatant-hud { position: absolute; top: 15px; width: 320px; background: rgba(0,0,0,0.8); border: 2px solid #8b4513; border-radius: 8px; padding: 12px; }
        .combatant-hud.left { left: 15px; }
        .combatant-hud.right { right: 15px; }
        .hud-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #444; }
        .hud-row:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .hud-icon { font-size: 1.5rem; }
        .hud-name { flex: 1; font-size: 0.9rem; color: #c9a227; }
        .hud-hp { font-size: 0.8rem; color: #aaa; }
        .hud-bar { height: 18px; background: #222; border-radius: 9px; overflow: hidden; flex: 1; }
        .hud-bar-fill { height: 100%; background: linear-gradient(180deg, #4CAF50 0%, #2d5a30 100%); transition: width 0.3s; }
        .hud-bar-fill.low { background: linear-gradient(180deg, #ff9800 0%, #b36b00 100%); }
        .hud-bar-fill.critical { background: linear-gradient(180deg, #f44336 0%, #a02a2a 100%); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.7; } }
        .hud-conditions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
        .condition-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 8px; background: #666; }

        #round-display { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 2px solid #c9a227; border-radius: 8px; padding: 10px 25px; text-align: center; }
        #round-display .round { font-size: 1.1rem; color: #c9a227; }
        #round-display .turn { font-size: 0.85rem; color: #aaa; margin-top: 5px; }

        #combat-log { position: absolute; bottom: 15px; left: 15px; width: 380px; max-height: 180px; background: rgba(0,0,0,0.8); border: 2px solid #8b4513; border-radius: 8px; padding: 12px; overflow-y: auto; pointer-events: auto; }
        .log-entry { font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid rgba(139,69,19,0.2); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } }
        .log-entry.damage { color: #ff6b6b; }
        .log-entry.critical { color: #ff00ff; font-weight: bold; }
        .log-entry.miss { color: #888; }
        .log-entry.ability { color: #00ccff; }
        .log-entry.legendary { color: #ffd700; }
        .log-entry.round { color: #c9a227; text-align: center; font-weight: bold; border-color: #c9a227; }
        .log-entry.death { color: #fff; background: rgba(139,0,0,0.3); padding: 6px; border-radius: 4px; }
        .log-entry.heal { color: #4CAF50; }
        .log-entry.status { color: #9932cc; }
        .dice { background: #222; color: #c9a227; padding: 1px 4px; border-radius: 3px; font-family: monospace; }

        #battle-controls { position: absolute; bottom: 15px; right: 15px; display: flex; gap: 10px; pointer-events: auto; }
        .control-btn { padding: 10px 20px; background: #333; color: #c9a227; border: 2px solid #c9a227; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
        .control-btn:hover { background: #444; }

        /* Manual Mode Actions */
        #manual-panel { position: absolute; bottom: 210px; left: 15px; width: 380px; background: rgba(0,0,0,0.9); border: 2px solid #c9a227; border-radius: 8px; padding: 15px; display: none; pointer-events: auto; }
        .manual-title { font-size: 1rem; color: #c9a227; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #444; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-btn { padding: 10px; background: #222; border: 2px solid #555; border-radius: 5px; cursor: pointer; text-align: left; transition: all 0.2s; }
        .action-btn:hover { border-color: #c9a227; background: #333; }
        .action-name { font-size: 0.85rem; color: #c9a227; }
        .action-info { font-size: 0.7rem; color: #888; margin-top: 3px; }

        /* Victory */
        #victory-screen { background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; }
        .victory-title { font-family: 'Times New Roman', serif; font-size: 3rem; color: #c9a227; animation: glow 2s infinite; }
        .victory-icon { font-size: 6rem; margin: 30px 0; }
        .victory-name { font-size: 1.8rem; margin-bottom: 20px; }
        .victory-stats { background: rgba(50,50,50,0.5); padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: left; }
        .victory-stats p { padding: 5px 0; }

        /* Stats Screen */
        #stats-screen { background: rgba(0,0,0,0.95); flex-direction: column; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; flex: 1; overflow-y: auto; padding: 20px 0; }
        .stat-card { background: rgba(30,20,20,0.8); border: 2px solid #8b4513; border-radius: 8px; padding: 20px; }
        .stat-card h3 { color: #c9a227; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #8b4513; }
        .leaderboard-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #333; }
        .leaderboard-rank { font-size: 1.3rem; color: #c9a227; width: 30px; }
        .leaderboard-icon { font-size: 1.2rem; }
        .leaderboard-name { flex: 1; }
        .leaderboard-wins { color: #4CAF50; }

        /* Damage Popup */
        .damage-popup { position: fixed; font-family: 'Times New Roman', serif; font-size: 1.8rem; font-weight: bold; color: #ff4444; text-shadow: 2px 2px 4px #000; pointer-events: none; animation: float 1s forwards; z-index: 200; }
        .damage-popup.critical { color: #ff00ff; font-size: 2.2rem; }
        .damage-popup.heal { color: #4CAF50; }
        @keyframes float { to { opacity: 0; transform: translateY(-40px); } }

        /* Loading */
        #loading { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 300; }
        .loader { width: 50px; height: 50px; border: 4px solid #333; border-top-color: #c9a227; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 900px) {
            .select-body { grid-template-columns: 1fr; }
            .vs-panel { padding: 15px 0; }
            .combatant-hud { width: calc(50% - 20px); }
            #combat-log { width: calc(100% - 30px); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading"><div class="loader"></div></div>
        <div id="canvas-container"></div>

        <!-- Title Screen -->
        <div id="title-screen" class="screen active">
            <h1 class="title">Monster Battle</h1>
            <p class="subtitle">3D Arena Ultimate</p>
            <div class="mode-buttons">
                <button class="mode-btn" onclick="startMode('1v1')"><span class="icon">⚔️</span>Classic 1v1</button>
                <button class="mode-btn" onclick="startMode('team')"><span class="icon">👥</span>Team Battle</button>
                <button class="mode-btn" onclick="startMode('tournament')"><span class="icon">🏆</span>Tournament</button>
                <button class="mode-btn" onclick="startMode('manual')"><span class="icon">🎮</span>Manual Mode</button>
                <button class="mode-btn" onclick="showStats()"><span class="icon">📊</span>Statistics</button>
            </div>
        </div>

        <!-- Selection Screen -->
        <div id="select-screen" class="screen">
            <div class="select-header">
                <button class="header-btn" onclick="backToTitle()">← Back</button>
                <div class="select-title" id="select-title">Select Your Champions</div>
                <button class="header-btn fight" id="fight-btn" onclick="startBattle()" disabled>⚔️ FIGHT</button>
            </div>
            <div class="select-body">
                <div class="team-panel">
                    <div class="team-title red">🔴 Red Team</div>
                    <div class="team-slots" id="red-slots"></div>
                    <div class="type-filters" id="red-filters"></div>
                    <div class="monster-grid" id="red-grid"></div>
                </div>
                <div class="vs-panel"><div class="vs-text">VS</div></div>
                <div class="team-panel">
                    <div class="team-title blue">🔵 Blue Team</div>
                    <div class="team-slots" id="blue-slots"></div>
                    <div class="type-filters" id="blue-filters"></div>
                    <div class="monster-grid" id="blue-grid"></div>
                </div>
            </div>
        </div>

        <!-- Tournament Screen -->
        <div id="tournament-screen" class="screen">
            <div class="select-header">
                <button class="header-btn" onclick="backToTitle()">← Exit</button>
                <div class="select-title">🏆 Tournament Bracket</div>
                <button class="header-btn fight" id="next-match-btn" onclick="runNextMatch()">Next Match →</button>
            </div>
            <div class="bracket" id="bracket"></div>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="combatant-hud left" id="hud-left"></div>
            <div id="round-display">
                <div class="round">Round <span id="round-num">1</span></div>
                <div class="turn" id="turn-text">Battle Start!</div>
            </div>
            <div class="combatant-hud right" id="hud-right"></div>
            <div id="combat-log"></div>
            <div id="battle-controls">
                <button class="control-btn" id="pause-btn" onclick="togglePause()">⏸️ Pause</button>
                <button class="control-btn" onclick="skipBattle()">⏭️ Skip</button>
                <button class="control-btn" onclick="endBattle()">🚪 Exit</button>
            </div>
            <div id="manual-panel">
                <div class="manual-title">Your Actions</div>
                <div class="action-grid" id="action-grid"></div>
            </div>
        </div>

        <!-- Victory Screen -->
        <div id="victory-screen" class="screen">
            <div class="victory-title">🏆 VICTORY 🏆</div>
            <div class="victory-icon" id="victory-icon"></div>
            <div class="victory-name" id="victory-name"></div>
            <div class="victory-stats" id="victory-stats"></div>
            <button class="mode-btn" onclick="closeVictory()">Continue</button>
        </div>

        <!-- Stats Screen -->
        <div id="stats-screen" class="screen">
            <div class="select-header">
                <button class="header-btn" onclick="backToTitle()">← Back</button>
                <div class="select-title">📊 Battle Statistics</div>
                <button class="header-btn" onclick="clearStats()">Clear Stats</button>
            </div>
            <div class="stats-grid" id="stats-grid"></div>
        </div>
    </div>

<script>
// ==================== THREE.JS SETUP ====================
let scene, camera, renderer, clock;
let monsters3D = {};
let particles = [];
let cameraAngle = 0, cameraHeight = 10, cameraDistance = 25;
let isMouseDown = false, mouseX = 0, mouseY = 0;
let maxTeamSize = 1, minTeamSize = 1;

function initThreeJS() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0505, 0.012);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    updateCamera();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    clock = new THREE.Clock();

    createArena();
    createLighting();
    setupControls();
    animate();

    setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
}

function createArena() {
    // Floor
    const floorGeom = new THREE.CircleGeometry(18, 64);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeom, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Rune circles
    [12, 8, 4].forEach((radius, i) => {
        const runeGeom = new THREE.RingGeometry(radius - 0.2, radius, 64);
        const runeMat = new THREE.MeshBasicMaterial({ color: 0xc9a227, transparent: true, opacity: 0.4 - i * 0.1 });
        const rune = new THREE.Mesh(runeGeom, runeMat);
        rune.rotation.x = -Math.PI / 2;
        rune.position.y = 0.01;
        scene.add(rune);
    });

    // Columns with torches
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const x = Math.cos(angle) * 16;
        const z = Math.sin(angle) * 16;

        const colGeom = new THREE.CylinderGeometry(0.4, 0.5, 7, 8);
        const colMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
        const column = new THREE.Mesh(colGeom, colMat);
        column.position.set(x, 3.5, z);
        column.castShadow = true;
        scene.add(column);

        if (i % 2 === 0) {
            const light = new THREE.PointLight(0xff6600, 0.8, 12);
            light.position.set(x, 6, z);
            scene.add(light);
        }
    }

    // Sky
    const skyGeom = new THREE.SphereGeometry(100, 32, 32);
    const skyMat = new THREE.MeshBasicMaterial({ color: 0x0a0505, side: THREE.BackSide });
    scene.add(new THREE.Mesh(skyGeom, skyMat));

    // Ambient particles
    const dustGeom = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(300 * 3);
    for (let i = 0; i < 300; i++) {
        dustPositions[i * 3] = (Math.random() - 0.5) * 40;
        dustPositions[i * 3 + 1] = Math.random() * 15;
        dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 40;
    }
    dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({ color: 0xc9a227, size: 0.05, transparent: true, opacity: 0.4 });
    const dust = new THREE.Points(dustGeom, dustMat);
    dust.userData.type = 'dust';
    scene.add(dust);
    particles.push(dust);
}

function createLighting() {
    scene.add(new THREE.AmbientLight(0x331111, 0.4));

    const mainLight = new THREE.SpotLight(0xffeedd, 1.5);
    mainLight.position.set(0, 25, 0);
    mainLight.angle = Math.PI / 4;
    mainLight.castShadow = true;
    scene.add(mainLight);

    const redLight = new THREE.PointLight(0xff3300, 0.6, 25);
    redLight.position.set(-10, 5, 0);
    scene.add(redLight);

    const blueLight = new THREE.PointLight(0x3366ff, 0.6, 25);
    blueLight.position.set(10, 5, 0);
    scene.add(blueLight);
}

function updateCamera() {
    camera.position.x = Math.sin(cameraAngle) * cameraDistance;
    camera.position.z = Math.cos(cameraAngle) * cameraDistance;
    camera.position.y = cameraHeight;
    camera.lookAt(0, 2, 0);
}

function setupControls() {
    const canvas = renderer.domElement;
    canvas.addEventListener('mousedown', e => { isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY; });
    canvas.addEventListener('mousemove', e => {
        if (isMouseDown) {
            cameraAngle -= (e.clientX - mouseX) * 0.01;
            cameraHeight = Math.max(3, Math.min(20, cameraHeight + (e.clientY - mouseY) * 0.05));
            mouseX = e.clientX; mouseY = e.clientY;
        }
    });
    canvas.addEventListener('mouseup', () => isMouseDown = false);
    canvas.addEventListener('wheel', e => cameraDistance = Math.max(12, Math.min(45, cameraDistance + e.deltaY * 0.02)));
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    // Auto-rotate when battle running
    if (Game.isRunning && !isMouseDown) cameraAngle += 0.002;
    updateCamera();

    // Animate monsters
    Object.values(monsters3D).forEach(m => {
        if (m.userData?.alive !== false) {
            m.position.y = (m.userData?.baseY || 0) + Math.sin(time * 2 + (m.userData?.phase || 0)) * 0.1;
        }
    });

    // Animate dust
    particles.forEach(p => {
        if (p.userData?.type === 'dust') {
            const pos = p.geometry.attributes.position.array;
            for (let i = 1; i < pos.length; i += 3) {
                pos[i] += 0.003;
                if (pos[i] > 15) pos[i] = 0;
            }
            p.geometry.attributes.position.needsUpdate = true;
        }
    });

    renderer.render(scene, camera);
}

// ==================== 3D MONSTER CREATION ====================
function createMonster3D(combatant) {
    const group = new THREE.Group();
    const color = combatant.color || 0x888888;
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });

    // Body based on type
    let body;
    const type = combatant.type || 'beast';

    if (type === 'dragon') {
        // Dragon body
        body = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 8), mat);
        torso.position.y = 1;
        body.add(torso);
        const head = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1, 6), mat);
        head.position.set(0, 1.8, 0.6);
        head.rotation.x = Math.PI / 2;
        body.add(head);
        // Wings
        const wingGeom = new THREE.ConeGeometry(0.3, 1.8, 4);
        [-1, 1].forEach(side => {
            const wing = new THREE.Mesh(wingGeom, mat);
            wing.position.set(side, 1.5, -0.3);
            wing.rotation.z = side * Math.PI / 3;
            body.add(wing);
        });
    } else if (type === 'undead') {
        body = new THREE.Group();
        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), mat);
        skull.position.y = 1.8;
        body.add(skull);
        const robe = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.5, 6), mat);
        robe.position.y = 0.8;
        body.add(robe);
        // Aura
        const aura = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x44ff44, transparent: true, opacity: 0.15, side: THREE.BackSide }));
        aura.position.y = 1.2;
        body.add(aura);
    } else if (type === 'fiend') {
        body = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.7, 2, 8), mat);
        torso.position.y = 1;
        body.add(torso);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), mat);
        head.position.y = 2.2;
        body.add(head);
        // Horns
        const hornMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        [-1, 1].forEach(side => {
            const horn = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.5, 6), hornMat);
            horn.position.set(side * 0.3, 2.5, 0);
            horn.rotation.z = side * Math.PI / 6;
            body.add(horn);
        });
    } else if (type === 'aberration') {
        body = new THREE.Group();
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), mat);
        eye.position.y = 1.5;
        body.add(eye);
        // Central eye
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
        pupil.position.set(0, 1.5, 0.7);
        body.add(pupil);
        // Eyestalks
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.6, 6), mat);
            stalk.position.set(Math.cos(angle) * 0.5, 2.1, Math.sin(angle) * 0.5);
            stalk.rotation.x = Math.PI / 6;
            body.add(stalk);
        }
    } else if (type === 'giant') {
        body = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 2.5, 8), mat);
        torso.position.y = 1.5;
        body.add(torso);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), mat);
        head.position.y = 3;
        body.add(head);
        body.scale.set(1.4, 1.4, 1.4);
    } else if (type === 'construct') {
        body = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), mat);
        torso.position.y = 1.5;
        body.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.6), mat);
        head.position.y = 2.5;
        body.add(head);
        // Core glow
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff6600 }));
        core.position.y = 1.5;
        body.add(core);
    } else if (type === 'ooze') {
        // Cube/blob
        body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.7 }));
        body.position.y = 0.75;
    } else {
        // Default beast
        body = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), mat);
        torso.position.y = 1;
        torso.scale.set(1, 0.7, 1.3);
        body.add(torso);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), mat);
        head.position.set(0, 1.2, 0.8);
        body.add(head);
    }

    group.add(body);

    // Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    [-0.15, 0.15].forEach(x => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
        eye.position.set(x, type === 'aberration' ? 1.5 : 1.6, type === 'ooze' ? 0.7 : 0.4);
        group.add(eye);
    });

    group.position.set(combatant.position.x, 0, combatant.position.z);
    group.rotation.y = combatant.team === 'red' ? Math.PI / 6 : -Math.PI / 6;
    group.userData = { id: combatant.id, alive: true, baseY: 0, phase: Math.random() * Math.PI * 2 };

    scene.add(group);
    return group;
}

function createAttackEffect(attacker3D, defender3D, type) {
    const start = attacker3D.position.clone();
    start.y += 1.5;
    const end = defender3D.position.clone();
    end.y += 1.5;

    const colors = { fire: 0xff4400, cold: 0x44ccff, lightning: 0xffff00, necrotic: 0x44ff44, poison: 0x00ff00, psychic: 0x9944ff, acid: 0x88ff00, force: 0xff00ff, thunder: 0x6666ff };
    const color = colors[type] || 0xffffff;

    const geom = new THREE.BufferGeometry();
    const positions = new Float32Array(40 * 3);
    const velocities = [];

    for (let i = 0; i < 40; i++) {
        positions[i * 3] = start.x;
        positions[i * 3 + 1] = start.y;
        positions[i * 3 + 2] = start.z;
        velocities.push({
            x: (end.x - start.x) / 25 + (Math.random() - 0.5) * 0.15,
            y: (end.y - start.y) / 25 + (Math.random() - 0.5) * 0.15,
            z: (end.z - start.z) / 25 + (Math.random() - 0.5) * 0.15
        });
    }

    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color, size: 0.25, transparent: true, blending: THREE.AdditiveBlending });
    const effect = new THREE.Points(geom, mat);
    effect.userData = { velocities, life: 25 };
    scene.add(effect);

    // Animate
    const animateEffect = () => {
        if (effect.userData.life <= 0) { scene.remove(effect); return; }
        const pos = effect.geometry.attributes.position.array;
        effect.userData.velocities.forEach((v, i) => {
            pos[i * 3] += v.x;
            pos[i * 3 + 1] += v.y;
            pos[i * 3 + 2] += v.z;
        });
        effect.geometry.attributes.position.needsUpdate = true;
        effect.material.opacity -= 0.04;
        effect.userData.life--;
        requestAnimationFrame(animateEffect);
    };
    animateEffect();

    // Impact
    setTimeout(() => createImpact(end, color), 250);
}

function createImpact(pos, color) {
    const geom = new THREE.BufferGeometry();
    const positions = new Float32Array(25 * 3);
    const velocities = [];

    for (let i = 0; i < 25; i++) {
        positions[i * 3] = pos.x;
        positions[i * 3 + 1] = pos.y;
        positions[i * 3 + 2] = pos.z;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.2 + 0.1;
        velocities.push({ x: Math.cos(angle) * speed, y: Math.random() * 0.2, z: Math.sin(angle) * speed });
    }

    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color, size: 0.2, transparent: true, blending: THREE.AdditiveBlending });
    const impact = new THREE.Points(geom, mat);
    impact.userData = { velocities, life: 30 };
    scene.add(impact);

    const animateImpact = () => {
        if (impact.userData.life <= 0) { scene.remove(impact); return; }
        const pos = impact.geometry.attributes.position.array;
        impact.userData.velocities.forEach((v, i) => {
            pos[i * 3] += v.x;
            pos[i * 3 + 1] += v.y;
            pos[i * 3 + 2] += v.z;
            v.y -= 0.008;
        });
        impact.geometry.attributes.position.needsUpdate = true;
        impact.material.opacity -= 0.03;
        impact.userData.life--;
        requestAnimationFrame(animateImpact);
    };
    animateImpact();
}

// ==================== UI FUNCTIONS ====================
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id)?.classList.add('active');
}

function startMode(mode) {
    Game.mode = mode;
    Game.isManual = (mode === 'manual');
    Game.redTeam = [];
    Game.blueTeam = [];

    if (mode === '1v1' || mode === 'manual') {
        maxTeamSize = 1; minTeamSize = 1;
    } else if (mode === 'team') {
        maxTeamSize = 4; minTeamSize = 2;
    } else if (mode === 'tournament') {
        maxTeamSize = 8; minTeamSize = 8;
        Game.tournamentFighters = [];
        setupTournamentSelect();
        return;
    }

    const title = mode === 'manual' ? 'Select Your Champion (You control Red)' :
                  mode === 'team' ? 'Build Your Teams (2-4 each)' : 'Select Your Champions';
    document.getElementById('select-title').textContent = title;

    setupTeamSelect();
    showScreen('select-screen');
    AudioSystem.init();
    AudioSystem.playSelect();
}

function setupTeamSelect() {
    const types = getMonsterTypes();
    ['red', 'blue'].forEach(team => {
        const filters = document.getElementById(`${team}-filters`);
        filters.innerHTML = '<button class="type-btn active" data-type="all">All</button>' +
            types.map(t => `<button class="type-btn" data-type="${t}">${t}</button>`).join('');

        filters.querySelectorAll('.type-btn').forEach(btn => {
            btn.onclick = () => {
                filters.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterGrid(team, btn.dataset.type);
            };
        });

        renderMonsterGrid(team);
        updateTeamSlots(team);
    });
}

function renderMonsterGrid(team) {
    const grid = document.getElementById(`${team}-grid`);
    const teamArr = team === 'red' ? Game.redTeam : Game.blueTeam;
    const otherTeam = team === 'red' ? Game.blueTeam : Game.redTeam;

    grid.innerHTML = getMonstersByCR().map(([key, m]) => {
        const inTeam = teamArr.some(t => t.key === key);
        const inOther = otherTeam.some(t => t.key === key);
        const isFull = teamArr.length >= maxTeamSize;
        const disabled = inOther || (isFull && !inTeam);

        return `<div class="monster-card ${inTeam ? 'selected' : ''} ${disabled ? 'disabled' : ''}"
                     data-key="${key}" data-type="${m.type}" onclick="toggleMonster('${key}', '${team}')">
            <div class="icon">${m.icon}</div>
            <div class="name">${m.name}</div>
            <div class="cr">CR ${m.cr}</div>
        </div>`;
    }).join('');
}

function filterGrid(team, type) {
    const grid = document.getElementById(`${team}-grid`);
    grid.querySelectorAll('.monster-card').forEach(card => {
        card.style.display = (type === 'all' || card.dataset.type === type) ? 'block' : 'none';
    });
}

function toggleMonster(key, team) {
    const teamArr = team === 'red' ? Game.redTeam : Game.blueTeam;
    const idx = teamArr.findIndex(m => m.key === key);

    if (idx >= 0) {
        teamArr.splice(idx, 1);
    } else if (teamArr.length < maxTeamSize) {
        teamArr.push({ ...MONSTERS[key], key });
    }

    renderMonsterGrid('red');
    renderMonsterGrid('blue');
    updateTeamSlots('red');
    updateTeamSlots('blue');
    updateFightButton();
    AudioSystem.playSelect();
}

function updateTeamSlots(team) {
    const slots = document.getElementById(`${team}-slots`);
    const teamArr = team === 'red' ? Game.redTeam : Game.blueTeam;

    slots.innerHTML = '';
    for (let i = 0; i < maxTeamSize; i++) {
        const m = teamArr[i];
        if (m) {
            slots.innerHTML += `<div class="team-slot filled" onclick="removeFromTeam('${team}', ${i})">
                <div class="icon">${m.icon}</div>
                <div class="name">${m.name}</div>
            </div>`;
        } else {
            slots.innerHTML += `<div class="team-slot">${i + 1}</div>`;
        }
    }
}

function removeFromTeam(team, idx) {
    const teamArr = team === 'red' ? Game.redTeam : Game.blueTeam;
    teamArr.splice(idx, 1);
    renderMonsterGrid('red');
    renderMonsterGrid('blue');
    updateTeamSlots(team);
    updateFightButton();
}

function updateFightButton() {
    const btn = document.getElementById('fight-btn');
    btn.disabled = !(Game.redTeam.length >= minTeamSize && Game.blueTeam.length >= minTeamSize);
}

function backToTitle() {
    Game.isRunning = false;
    AudioSystem.stopMusic();
    clearArena();
    showScreen('title-screen');
}

function renderMatch(match, idx) {

            const isLoser = match.winner !== null && match.winner !== i;
            return `<div class="bracket-fighter ${isWinner ? 'winner' : ''} ${isLoser ? 'loser' : ''}">
                <span class="icon">${f.icon}</span>
                <span class="name">${f.name}</span>

        }).join('')}

function runNextMatch() {

    if (!match || match.winner !== null) return;

    Game.mode = 'tournament-match';
    Game.redTeam = [{ ...match.fighters[0] }];
    Game.blueTeam = [{ ...match.fighters[1] }];

// ==================== BATTLE ====================
function startBattle() {
    showScreen('select-screen');
    document.getElementById('select-screen').classList.remove('active');
    document.getElementById('hud').style.display = 'block';

    clearArena();
    const combatants = initializeBattle();

    // Create 3D monsters
    combatants.forEach(c => {
        monsters3D[c.id] = createMonster3D(c);
    });

    // Setup HUD
    updateHUD();
    document.getElementById('combat-log').innerHTML = '';
    log('⚔️ BATTLE BEGINS! ⚔️', 'round');

    combatants.forEach(c => {
        log(`${c.icon} ${c.name} rolls initiative: ${c.initiative}`, '');
    });
    log(`${combatants[0].icon} ${combatants[0].name} goes first!`, 'round');

    AudioSystem.startBattleMusic();

    if (Game.isManual) {
        document.getElementById('manual-panel').style.display = 'block';
    }

    setTimeout(runCombatLoop, 1500);
}

async function runCombatLoop() {
    Game.isRunning = true;

    while (Game.isRunning) {
        if (Game.isPaused) {
            await delay(100);
            continue;
        }

        // Check victory
        const winner = checkVictory();
        if (winner) {
            endBattleVictory(winner);
            return;
        }

        // New round marker
        if (Game.currentTurn === 0) {
            log(`═══ ROUND ${Game.round} ═══`, 'round');
            document.getElementById('round-num').textContent = Game.round;
            AudioSystem.playRoundStart();
        }

        // Get current combatant
        const current = getNextCombatant();
        if (!current) break;

        // Skip dead
        while (!Game.combatants[Game.currentTurn]?.alive) {
            advanceTurn();
            if (Game.currentTurn === 0) break;
        }

        const attacker = Game.combatants[Game.currentTurn];
        if (!attacker?.alive) { advanceTurn(); continue; }

        // Update UI
        document.getElementById('turn-text').textContent = `${attacker.icon} ${attacker.name}'s turn`;
        highlightActive(attacker.id);

        await delay(Game.speed / 2);

        // Get target function
        const getTarget = async (atk, enemies) => {
            if (Game.isManual && atk.team === Game.playerTeam) {
                return await getPlayerTarget(atk, enemies);
            }
            return selectBestTarget(atk, enemies);
        };

        // Execute turn
        await executeTurn(
            attacker,
            getTarget,
            (atk, def, type) => {
                if (monsters3D[atk.id] && monsters3D[def.id]) {
                    createAttackEffect(monsters3D[atk.id], monsters3D[def.id], type);
                }
            },
            (target, dmg, crit) => {
                showDamagePopup(target, dmg, crit);
                updateHUD();
                if (!target.alive && monsters3D[target.id]) {
                    monsters3D[target.id].userData.alive = false;
                    fadeOutMonster(monsters3D[target.id]);
                }
            },
            log
        );

        await delay(Game.speed / 2);
        advanceTurn();
    }
}

function highlightActive(id) {
    Object.entries(monsters3D).forEach(([mId, m]) => {
        m.scale.setScalar(mId == id ? 1.15 : 1);
    });
}

function fadeOutMonster(m) {
    m.traverse(child => {
        if (child.material) {
            child.material.transparent = true;
            child.material.opacity = 0.3;
        }
    });
}

function clearArena() {
    Object.values(monsters3D).forEach(m => scene.remove(m));
    monsters3D = {};
}

function showDamagePopup(target, dmg, crit) {
    const m = monsters3D[target.id];
    if (!m) return;

    const vec = m.position.clone();
    vec.project(camera);
    const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-vec.y * 0.5 + 0.5) * window.innerHeight;

    const popup = document.createElement('div');
    popup.className = 'damage-popup' + (crit ? ' critical' : '');
    popup.textContent = `-${dmg}`;
    popup.style.left = x + 'px';
    popup.style.top = y + 'px';
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 1000);
}

function updateHUD() {
    const redTeam = Game.combatants.filter(c => c.team === 'red');
    const blueTeam = Game.combatants.filter(c => c.team === 'blue');

    document.getElementById('hud-left').innerHTML = redTeam.map(c => renderHUDRow(c)).join('');
    document.getElementById('hud-right').innerHTML = blueTeam.map(c => renderHUDRow(c)).join('');
}

function renderHUDRow(c) {
    const pct = Math.max(0, (c.currentHp / c.maxHp) * 100);
    const barClass = pct <= 25 ? 'critical' : pct <= 50 ? 'low' : '';
    const conditions = c.conditions.map(cond => {
        const info = STATUS_EFFECTS[cond.type] || { icon: '?', color: '#666' };
        return `<span class="condition-badge" style="background:${info.color}">${info.icon} ${cond.type}</span>`;
    }).join('');

    return `<div class="hud-row ${!c.alive ? 'dead' : ''}">
        <span class="hud-icon">${c.icon}</span>
        <span class="hud-name">${c.name}</span>
        <span class="hud-hp">${Math.max(0, c.currentHp)}/${c.maxHp}</span>
    </div>
    <div class="hud-row">
        <div class="hud-bar"><div class="hud-bar-fill ${barClass}" style="width:${pct}%"></div></div>
    </div>
    ${conditions ? `<div class="hud-conditions">${conditions}</div>` : ''}`;
}

function log(msg, type = '') {
    const logEl = document.getElementById('combat-log');
    logEl.innerHTML += `<div class="log-entry ${type}">${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
}

// ==================== MANUAL MODE ====================
async function getPlayerTarget(attacker, enemies) {
    return new Promise(resolve => {
        Game.waitingForPlayer = true;
        const panel = document.getElementById('manual-panel');
        const grid = document.getElementById('action-grid');

        // Show available actions
        grid.innerHTML = '';

        // Attacks
        attacker.attacks?.forEach(atk => {
            grid.innerHTML += `<div class="action-btn" data-action="attack" data-name="${atk.name}">
                <div class="action-name">⚔️ ${atk.name}</div>
                <div class="action-info">+${atk.hit} to hit, ${atk.dmg}</div>
            </div>`;
        });

        // Special ability
        if (attacker.special && attacker.specialCharged && attacker.special.dmg) {
            grid.innerHTML += `<div class="action-btn" data-action="special">
                <div class="action-name">✨ ${attacker.special.name}</div>
                <div class="action-info">${attacker.special.dmg} ${attacker.special.type}</div>
            </div>`;
        }

        // End turn
        grid.innerHTML += `<div class="action-btn" data-action="end">
            <div class="action-name">⏭️ End Turn</div>
            <div class="action-info">Skip your action</div>
        </div>`;

        const handleClick = (e) => {
            const btn = e.target.closest('.action-btn');
            if (!btn) return;

            const action = btn.dataset.action;
            grid.removeEventListener('click', handleClick);
            Game.waitingForPlayer = false;

            if (action === 'end') {
                resolve(null);
            } else {
                // For now, auto-select first enemy
                resolve(enemies[0]);
            }
        };

        grid.addEventListener('click', handleClick);
    });
}

// ==================== BATTLE CONTROLS ====================
function togglePause() {
    Game.isPaused = !Game.isPaused;
    document.getElementById('pause-btn').textContent = Game.isPaused ? '▶️ Resume' : '⏸️ Pause';
}

function skipBattle() {
    Game.speed = 50;
    Game.isPaused = false;
}

function endBattle() {
    Game.isRunning = false;
    AudioSystem.stopMusic();
    document.getElementById('hud').style.display = 'none';
    document.getElementById('manual-panel').style.display = 'none';
    clearArena();

    if (Game.mode === 'tournament-match') {
        showScreen('tournament-screen');
        renderBracket();
    } else {
        backToTitle();
    }
}

function endBattleVictory(winningTeam) {
    Game.isRunning = false;
    AudioSystem.stopMusic();
    AudioSystem.playVictory();

    const winners = Game.combatants.filter(c => c.team === winningTeam && c.alive);
    const losers = Game.combatants.filter(c => c.team !== winningTeam);

    // Save stats
    saveStats(winners, losers, Game.round);

    // Tournament advancement
    if (Game.mode === 'tournament-match') {
        advanceTournament(winningTeam === 'red' ? 0 : 1);
    }

    // Show victory
    document.getElementById('victory-icon').textContent = winners[0]?.icon || '🏆';
    document.getElementById('victory-name').textContent = winners.length === 1 ? winners[0].name : `${winningTeam.toUpperCase()} TEAM`;
    document.getElementById('victory-stats').innerHTML = `
        <p>Rounds: ${Game.round}</p>
        <p>Survivors: ${winners.map(w => `${w.icon} ${w.name} (${w.currentHp}/${w.maxHp} HP)`).join(', ')}</p>
    `;

    showScreen('victory-screen');
}

function closeVictory() {
    document.getElementById('hud').style.display = 'none';
    document.getElementById('manual-panel').style.display = 'none';
    clearArena();
    Game.speed = 1000;

    if (Game.mode === 'tournament-match') {
        if (Game.tournament.currentMatch < 7) {
            showScreen('tournament-screen');
            renderBracket();
        } else {
            // Tournament complete
            alert(`🏆 TOURNAMENT CHAMPION: ${Game.tournament.champion.name}! 🏆`);
            backToTitle();
        }
    } else {
        backToTitle();
    }
}

// ==================== STATISTICS ====================
function showStats() {
    const grid = document.getElementById('stats-grid');
    const leaderboard = getLeaderboard();

    grid.innerHTML = `
        <div class="stat-card">
            <h3>🏆 Leaderboard</h3>
            ${leaderboard.length === 0 ? '<p style="color:#666">No battles yet!</p>' :
              leaderboard.map((entry, i) => `
                <div class="leaderboard-row">
                    <span class="leaderboard-rank">${i + 1}</span>
                    <span class="leaderboard-icon">${entry.monster.icon}</span>
                    <span class="leaderboard-name">${entry.monster.name}</span>
                    <span class="leaderboard-wins">${entry.wins} wins</span>
                </div>
            `).join('')}
        </div>
        <div class="stat-card">
            <h3>📈 Overall Stats</h3>
            <p>Total Battles: ${Game.stats.totalBattles}</p>
            <p>Total Rounds: ${Game.stats.totalRounds}</p>
            <p>Avg Rounds/Battle: ${Game.stats.totalBattles ? (Game.stats.totalRounds / Game.stats.totalBattles).toFixed(1) : 0}</p>
        </div>
        <div class="stat-card">
            <h3>⚔️ Recent Battles</h3>
            ${Game.stats.battles.slice(-10).reverse().map(b => `
                <div class="leaderboard-row">
                    <span>🏆 ${b.winners.join(', ')}</span>
                    <span style="color:#666">vs ${b.losers.join(', ')}</span>
                </div>
            `).join('') || '<p style="color:#666">No battles yet!</p>'}
        </div>
    `;

    showScreen('stats-screen');
    AudioSystem.init();
}

// ==================== INIT ====================
window.onload = initThreeJS;
</script>
